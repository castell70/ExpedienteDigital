const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = (p = 'ID') => `${p}-${Date.now().toString(36).toUpperCase()}${Math.random().toString(36).slice(2, 5).toUpperCase()}`;
const esc = (s = '') => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function fmt(iso) {
  if (!iso) return '—';
  const d = new Date(String(iso).length > 10 ? iso : iso + 'T00:00:00');
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('es-SV', { day: '2-digit', month: 'short', year: 'numeric' });
}
function fmtDT(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleString('es-SV', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
function diasEntre(a, b) {
  if (!a || !b) return 0;
  const d1 = new Date(a), d2 = new Date(b);
  if (isNaN(d1) || isNaN(d2) || d2 < d1) return 0;
  return Math.round((d2 - d1) / 86400000) + 1;
}
function initials(n = '') {
  return n.split(' ').filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
}
function avatarColor(str = '') {
  const c = ['bg-corp-600','bg-emerald-600','bg-violet-600','bg-rose-600','bg-amber-600','bg-teal-600','bg-indigo-600','bg-cyan-600'];
  let h = 0; for (const ch of str) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return c[h % c.length];
}
function bytes(n) {
  if (!n && n !== 0) return '—';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1048576).toFixed(2) + ' MB';
}
function readAsDataURL(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.readAsDataURL(file);
  });
}
function download(filename, content, mime = 'application/json') {
  const blob = content instanceof Blob ? content : new Blob([content], { type: mime + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 400);
}

/* ------------------------------ TOASTS ------------------------------ */
function toast(msg, tipo = 'ok') {
  const styles = {
    ok:   'bg-emerald-600',
    err:  'bg-rose-600',
    warn: 'bg-amber-500',
    info: 'bg-corp-600'
  };
  const icons = { ok: '✓', err: '✕', warn: '!', info: 'i' };
  const el = document.createElement('div');
  el.className = `toast-in ${styles[tipo] || styles.ok} text-white text-sm rounded-xl shadow-lg px-4 py-3 flex items-start gap-3`;
  el.innerHTML = `<span class="font-bold">${icons[tipo] || '✓'}</span><span class="flex-1">${esc(msg)}</span>`;
  $('#toasts').appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .35s, transform .35s';
    el.style.opacity = '0'; el.style.transform = 'translateX(30px)';
    setTimeout(() => el.remove(), 350);
  }, 3600);
}

/* ------------------------------ PERSISTENCIA ------------------------------ */
let DB = null;

function loadDB() {
  try {
    let raw = localStorage.getItem(DB_KEY);
    // Migración transparente desde la clave anterior (Talent360 Hub)
    if (!raw) {
      const legacy = localStorage.getItem(LEGACY_DB_KEY);
      if (legacy) {
        raw = legacy;
        localStorage.setItem(DB_KEY, legacy);
        localStorage.removeItem(LEGACY_DB_KEY);
      }
    }
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (!d || !Array.isArray(d.empleados)) return null;
    d.solicitudes = d.solicitudes || [];
    d.candidatos  = d.candidatos  || [];
    d.politicas   = d.politicas   || [];
    d.auditoria   = d.auditoria   || [];
    d.meta        = d.meta        || defaultDB().meta;
    return d;
  } catch (e) { return null; }
}
function saveDB() {
  try {
    DB.meta.actualizado = new Date().toISOString();
    localStorage.setItem(DB_KEY, JSON.stringify(DB));
    return true;
  } catch (e) {
    toast('No se pudo guardar: almacenamiento lleno. Exporte un respaldo JSON y libere espacio.', 'err');
    console.error(e);
    return false;
  }
}
function log(accion, detalle) {
  DB.auditoria.unshift({ id: uid('LOG'), fecha: new Date().toISOString(), usuario: 'admin@itcpo.com', accion, detalle });
  DB.auditoria = DB.auditoria.slice(0, 400);
}
function commit(accion, detalle, silencioso = false) {
  if (accion) log(accion, detalle);
  saveDB();
  if (!silencioso) render();
}

/* ------------------------------ CONSULTAS ------------------------------ */
const getEmp  = id => DB.empleados.find(e => e.id === id);
const getCand = id => DB.candidatos.find(c => c.id === id);
const nombreEmp = id => { const e = getEmp(id); return e ? `${e.nombre} ${e.apellidos}` : 'Desconocido'; };
const departamentos = () => [...new Set(DB.empleados.map(e => e.departamento))].sort();
function saldoVacaciones(emp) {
  if (!emp) return 0;
  const tomadas = DB.solicitudes.filter(s => s.empleadoId === emp.id && s.tipo === 'Vacaciones' && s.estado === 'Aprobado')
    .reduce((a, s) => a + (s.dias || 0), 0);
  return Math.max(0, (emp.vacacionesAsignadas || 0) - tomadas);
}

function antiguedad(fecha) {
  if (!fecha) return '—';
  const d = new Date(fecha), n = new Date();
  let a = n.getFullYear() - d.getFullYear();
  let m = n.getMonth() - d.getMonth();
  if (m < 0) { a--; m += 12; }
  if (a <= 0 && m <= 0) return 'Menos de 1 mes';
  return `${a > 0 ? a + ' año' + (a > 1 ? 's' : '') : ''}${a > 0 && m > 0 ? ' y ' : ''}${m > 0 ? m + ' mes' + (m > 1 ? 'es' : '') : ''}`;
}
function field(label, value) {
  return `<div>
    <p class="text-[11px] uppercase tracking-wide text-slate-400 font-semibold">${label}</p>
    <p class="text-sm text-slate-700 mt-0.5 break-words">${value || '—'}</p>
  </div>`;
}
function docRow(empId, d) {
  const esPdf = (d.tipo || '').includes('pdf') || /\.pdf$/i.test(d.nombre);
  return `<div class="flex items-center gap-3 px-4 py-3 hover:bg-slate-50">

    </div>

      <button data-act="prevDoc" data-emp="${empId}" data-id="${d.id}" title="Previsualizar"

      ${d.data ? `<button data-act="dlDoc" data-emp="${empId}" data-id="${d.id}" title="Descargar"

/* ---- Carga de documentos ---- */
window.pickDoc = () => document.getElementById('docInput')?.click();
window.dropDocs = ev => {
  ev.preventDefault();
  ev.currentTarget.classList.remove('dragover');
  if (ev.dataTransfer?.files?.length) uploadDocs(ev.dataTransfer.files);
};
window.uploadDocs = async files => {
  const emp = getEmp(state.empSel);
  if (!emp) return;
  if (!emp.documentos) emp.documentos = [];
  let ok = 0, avisos = 0;
  for (const f of files) {
    const permitido = /\.(pdf|png|jpe?g|webp)$/i.test(f.name) || ['application/pdf','image/png','image/jpeg','image/webp'].includes(f.type);
    if (!permitido) { toast(`Formato no permitido: ${f.name}`, 'err'); continue; }
    const MAX = 2 * 1024 * 1024;
    let data = null;
    if (f.size <= MAX) {
      try { data = await readAsDataURL(f); } catch (e) { data = null; }
    } else { avisos++; }
    emp.documentos.unshift({
      id: uid('DOC'), nombre: f.name, tipo: f.type || 'application/octet-stream',
      size: f.size, fecha: hoy(), data, demo: false
    });
    ok++;
  }
  if (ok) commit('DOCUMENTO_CARGADO', `${ok} documento(s) cargado(s) en el expediente de ${emp.nombre} ${emp.apellidos}.`, true);
  if (ok) render();
  if (ok) toast(`${ok} documento(s) agregado(s) al expediente.`, 'ok');
  if (avisos) toast(`${avisos} archivo(s) superan 2 MB: se guardaron solo los metadatos.`, 'warn');
};

function talentoInterno() {
  const q = state.talQ.toLowerCase(), cq = state.talCert.toLowerCase();
  const nivelMin = parseInt(state.talNivel || '0', 10);

  const resultados = DB.empleados.map(e => {
    const comps = e.competencias || [];
    const caps  = e.capacitaciones || [];
    const skillHits = q ? comps.filter(c => c.nombre.toLowerCase().includes(q)) : [];
    const certHits  = cq ? caps.filter(c => c.nombre.toLowerCase().includes(cq) || (c.institucion || '').toLowerCase().includes(cq)) : [];
    const nivelOk = !nivelMin || comps.some(c => c.nivel >= nivelMin && (!q || c.nombre.toLowerCase().includes(q)));
    return { e, skillHits, certHits, nivelOk, score: skillHits.length * 2 + certHits.length * 2 + (nivelMin && nivelOk ? 1 : 0) };
  })
  .filter(r => {
    if (state.talDep && r.e.departamento !== state.talDep) return false;
    if (q && r.skillHits.length === 0) return false;
    if (cq && r.certHits.length === 0) return false;
    if (nivelMin && !r.nivelOk) return false;
    return true;
  })
  .sort((a, b) => b.score - a.score || a.e.nombre.localeCompare(b.e.nombre));

  return `
  <div class="grid grid-cols-1 lg:grid-cols-4 gap-5">
    <div class="lg:col-span-1 bg-white rounded-xl border border-slate-200 p-5 space-y-4 h-fit">

function talentoInternoResultados() {
  const q = state.talQ.toLowerCase(), cq = state.talCert.toLowerCase();
  const nivelMin = parseInt(state.talNivel || '0', 10);

  const resultados = DB.empleados.map(e => {
    const comps = e.competencias || [];
    const caps  = e.capacitaciones || [];
    const skillHits = q ? comps.filter(c => c.nombre.toLowerCase().includes(q)) : [];
    const certHits  = cq ? caps.filter(c => c.nombre.toLowerCase().includes(cq) || (c.institucion || '').toLowerCase().includes(cq)) : [];
    const nivelOk = !nivelMin || comps.some(c => c.nivel >= nivelMin && (!q || c.nombre.toLowerCase().includes(q)));
    return { e, skillHits, certHits, nivelOk, score: skillHits.length * 2 + certHits.length * 2 + (nivelMin && nivelOk ? 1 : 0) };
  })
  .filter(r => {
    if (state.talDep && r.e.departamento !== state.talDep) return false;
    if (q && r.skillHits.length === 0) return false;
    if (cq && r.certHits.length === 0) return false;
    if (nivelMin && !r.nivelOk) return false;
    return true;
  })
  .sort((a, b) => b.score - a.score || a.e.nombre.localeCompare(b.e.nombre));

  const hayFiltros = q || cq || state.talDep || nivelMin;

  if (!resultados.length) {
    return emptyState('Sin coincidencias', hayFiltros
      ? 'Ningún colaborador cumple con los criterios. Ajuste los filtros de búsqueda.'
      : 'Utilice los filtros para localizar talento interno por habilidad, certificación o departamento.');
  }

  return `
  <div class="space-y-3">
    <p class="text-xs text-slate-500">${resultados.length} colaborador(es) encontrado(s)${hayFiltros ? ' según los criterios aplicados' : ''}.</p>
    ${resultados.map(r => `
      <div class="bg-white rounded-xl border border-slate-200 p-5 hover:shadow-md transition">
        <div class="flex flex-col sm:flex-row sm:items-center gap-4">
          <div class="w-12 h-12 rounded-xl ${avatarColor(r.e.nombre + r.e.apellidos)} text-white grid place-items-center font-bold shrink-0">
            ${initials(r.e.nombre + ' ' + r.e.apellidos)}
          </div>
          <div class="flex-1 min-w-0">
            <p class="font-bold text-slate-800">${esc(r.e.nombre)} ${esc(r.e.apellidos)}</p>
            <p class="text-xs text-slate-500">${esc(r.e.puesto)} · ${esc(r.e.departamento)}</p>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-[11px] font-semibold px-2.5 py-1 rounded-full bg-accent-50 text-accent-700 ring-1 ring-accent-200">Afinidad ${r.score}</span>
            <button data-act="viewEmp" data-id="${r.e.id}" class="text-xs font-semibold text-corp-600 hover:text-accent-600">Ver perfil →</button>
          </div>
        </div>
        ${r.skillHits.length ? `<div class="mt-3 flex flex-wrap gap-1.5">
          ${r.skillHits.map(c => `<span class="text-[11px] px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 ring-1 ring-emerald-200 font-medium">${esc(c.nombre)} · ${c.nivel}/5</span>`).join('')}
        </div>` : ''}
        ${r.certHits.length ? `<div class="mt-2 flex flex-wrap gap-1.5">
          ${r.certHits.map(c => `<span class="text-[11px] px-2 py-0.5 rounded-full bg-sky-50 text-sky-700 ring-1 ring-sky-200 font-medium">🎓 ${esc(c.nombre)}</span>`).join('')}
        </div>` : ''}
      </div>`).join('')}
  </div>`;
}

function viewPoliticas() {
  const q = state.polQ.toLowerCase();
  const list = DB.politicas.filter(p => {
    if (!q) return true;
    const texto = `${p.titulo} ${p.categoria} ${p.articulos.map(a => a.n + ' ' + a.titulo + ' ' + a.texto).join(' ')}`.toLowerCase();
    return texto.includes(q);
  });

  const totalConf = DB.politicas.reduce((a, p) => a + (p.conformidades || []).length, 0);
  const totalPosibles = DB.politicas.length * DB.empleados.length;
  const pct = totalPosibles ? Math.round((totalConf / totalPosibles) * 100) : 0;

  return `
  <div class="space-y-5">
    ${pageHeader('Portal de Políticas y Reglamento Interno',
      'Centro de documentación corporativa con búsqueda de artículos y confirmación de lectura.')}

    ${statCards([
      { label: 'Documentos publicados', value: DB.politicas.length, tone: 'corp' },
      { label: 'Artículos indexados', value: DB.politicas.reduce((a, p) => a + p.articulos.length, 0), tone: 'violet' },
      { label: 'Conformidades firmadas', value: totalConf, tone: 'green' },
      { label: 'Cobertura de lectura', value: pct + '%', tone: 'orange' }
    ])}

    <div class="relative bg-white rounded-xl border border-slate-200 p-1">
      <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">${icon('search','w-4 h-4')}</span>
      <input value="${esc(state.polQ)}" oninput="state.polQ=this.value;document.getElementById('polList').innerHTML=listaPoliticas()"
        placeholder="Buscar por palabra clave, artículo o tema (ej. vacaciones, acoso, confidencialidad)…"
        class="w-full pl-10 pr-4 py-3 rounded-lg text-sm outline-none bg-transparent">
    </div>

    <div id="polList" class="space-y-4">${listaPoliticas()}</div>
  </div>`;
}

function listaPoliticas() {
  const q = state.polQ.toLowerCase();
  const list = DB.politicas.filter(p => {
    if (!q) return true;
    const texto = `${p.titulo} ${p.categoria} ${p.articulos.map(a => a.n + ' ' + a.titulo + ' ' + a.texto).join(' ')}`.toLowerCase();
    return texto.includes(q);
  });

  if (!list.length) return emptyState('Sin resultados', 'No se encontraron políticas que coincidan con la búsqueda.');

  return list.map(p => {
    const abierto = state.polOpen === p.id;
    const arts = q
      ? p.articulos.filter(a => `${a.n} ${a.titulo} ${a.texto}`.toLowerCase().includes(q))
      : p.articulos;
    const firmas = p.conformidades || [];
    const faltan = DB.empleados.filter(e => !firmas.some(f => f.empleadoId === e.id));
    return `
      <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
        <button data-act="polToggle" data-id="${p.id}" class="w-full flex items-center gap-4 px-5 py-4 text-left hover:bg-slate-50 transition">
          <div class="w-11 h-11 rounded-xl bg-corp-50 text-corp-600 grid place-items-center shrink-0">${icon('book','w-5 h-5')}</div>
          <div class="flex-1 min-w-0">
            <div class="flex flex-wrap items-center gap-2">
              <h4 class="font-bold text-slate-800">${esc(p.titulo)}</h4>
              ${p.obligatoria ? '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-accent-100 text-accent-700">OBLIGATORIA</span>' : ''}
            </div>
            <p class="text-xs text-slate-500 mt-0.5">${esc(p.categoria)} · ${esc(p.version)} · Actualizado ${fmt(p.fechaActualizacion)} · ${p.articulos.length} artículos</p>
          </div>
          <div class="hidden sm:flex items-center gap-3 shrink-0">
            <div class="text-right">
              <p class="text-[11px] text-slate-400">Conformidades</p>
              <p class="text-sm font-bold ${firmas.length === DB.empleados.length ? 'text-emerald-600' : 'text-amber-600'}">${firmas.length}/${DB.empleados.length}</p>
            </div>
            <svg class="w-5 h-5 text-slate-400 transition-transform ${abierto ? 'rotate-180' : ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
        </button>
        <div id="pol-body-${p.id}" class="${abierto ? '' : 'hidden'} border-t border-slate-200 bg-slate-50/50">
          <div class="p-5 space-y-3">
            ${arts.length ? arts.map(a => `
              <div class="bg-white rounded-lg border border-slate-200 p-4">
                <p class="text-xs font-bold text-accent-600 uppercase tracking-wide">${esc(a.n)}</p>
                <p class="font-semibold text-slate-800 text-sm mt-0.5">${esc(a.titulo)}</p>
                <p class="text-sm text-slate-600 mt-2 leading-relaxed text-justify">${esc(a.texto)}</p>
              </div>`).join('') : '<p class="text-sm text-slate-500 italic">No hay artículos que coincidan con la búsqueda dentro de esta política.</p>'}

            <div class="bg-white rounded-lg border border-slate-200 p-4">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div>
                  <p class="font-semibold text-slate-700 text-sm flex items-center gap-2">${icon('check','w-4 h-4 text-emerald-600')} Lectura y Conformidad Confirmada</p>
                  <p class="text-xs text-slate-500 mt-1">Registre la confirmación de lectura del colaborador. La acción queda auditada con fecha y hora.</p>
                </div>
                <button data-act="firmarPol" data-id="${p.id}"
                  class="inline-flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-4 py-2.5 rounded-lg transition whitespace-nowrap">
                  ${icon('check','w-4 h-4')} Confirmar lectura
                </button>
              </div>
              ${firmas.length ? `<div class="mt-4 flex flex-wrap gap-2">
                ${firmas.map(f => `<span class="inline-flex items-center gap-1.5 text-[11px] bg-emerald-50 text-emerald-700 ring-1 ring-emerald-200 px-2.5 py-1 rounded-full font-medium">
                  ✓ ${esc(nombreEmp(f.empleadoId))} <span class="text-emerald-500">· ${fmtDT(f.fecha)}</span></span>`).join('')}
              </div>` : '<p class="text-xs text-slate-400 mt-3 italic">Aún no hay conformidades registradas para este documento.</p>'}
              ${faltan.length ? `<p class="text-[11px] text-amber-600 mt-3">Pendientes de confirmar: ${faltan.map(e => esc(e.nombre + ' ' + e.apellidos)).join(', ')}</p>` : ''}
            </div>
          </div>
        </div>
      </div>`;
  }).join('');
}

/* ------------------------------ CSV ------------------------------ */
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c !== '\r') field += c;
    }
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}

function toCSV(headers, rows) {
  const escC = s => `"${String(s ?? '').replace(/"/g, '""')}"`;
  return '\uFEFF' + [headers.map(escC).join(','), ...rows.map(r => r.map(escC).join(','))].join('\r\n');
}

function exportarEmpleadosCSV() {
  const headers = ['id','nombre','apellidos','email','telefono','departamento','puesto','jefe','fechaIngreso','tipoContrato','salario','estado','vacacionesAsignadas','competencias','capacitaciones'];
  const rows = DB.empleados.map(e => [
    e.id, e.nombre, e.apellidos, e.email, e.telefono, e.departamento, e.puesto, e.jefe, e.fechaIngreso,
    e.tipoContrato, e.salario, e.estado, e.vacacionesAsignadas,
    (e.competencias || []).map(c => `${c.nombre}(${c.nivel})`).join('; '),
    (e.capacitaciones || []).map(c => c.nombre).join('; ')
  ]);
  download(`ExpedienteDigital_Empleados_${hoy()}.csv`, toCSV(headers, rows), 'text/csv');
  log('EXPORT_CSV', `Se exportaron ${rows.length} empleados a CSV.`);
  saveDB(); render();
  toast('Listado de empleados exportado en CSV.', 'ok');
}

window.dropBulk = ev => {
  ev.preventDefault();
  ev.currentTarget.classList.remove('dragover');
  const f = ev.dataTransfer?.files?.[0];
  if (f) procesarBulk(f);
};

window.procesarBulk = file => {
  if (!file) return;
  const esPDF = /\.pdf$/i.test(file.name) || file.type === 'application/pdf';
  const esCSV = /\.csv$/i.test(file.name) || file.type === 'text/csv';

  if (!esPDF && !esCSV) { toast('Formato no soportado. Utilice CSV o PDF.', 'err'); return; }

  const cont = document.getElementById('bulkPreview');
  cont.innerHTML = `
    <div class="border border-slate-200 rounded-xl p-6 bg-slate-50">
      <p class="text-sm font-semibold text-slate-700 mb-3">Procesando <span class="font-mono text-xs">${esc(file.name)}</span>…</p>
      <div class="h-2 rounded-full bg-slate-200 overflow-hidden">
        <div id="bulkBar" class="h-full bg-violet-600 rounded-full transition-all duration-300" style="width:5%"></div>
      </div>
      <p id="bulkMsg" class="text-xs text-slate-500 mt-2">Iniciando lectura del archivo…</p>
    </div>`;

  const pasos = esPDF
    ? ['Abriendo documento PDF…', 'Extrayendo texto de la capa superficial…', 'Identificando campos: nombre, correo, teléfono…', 'Normalizando habilidades y experiencia…', 'Generando registros de previsualización…']
    : ['Leyendo archivo CSV…', 'Detectando delimitador y encabezados…', 'Validando columnas requeridas…', 'Normalizando registros…', 'Generando previsualización…'];

  let i = 0;
  const timer = setInterval(() => {
    i++;
    const bar = document.getElementById('bulkBar');
    const msg = document.getElementById('bulkMsg');
    if (!bar) { clearInterval(timer); return; }
    bar.style.width = Math.min(95, 5 + i * 20) + '%';
    msg.textContent = pasos[Math.min(i - 1, pasos.length - 1)];
    if (i >= pasos.length) {
      clearInterval(timer);
      bar.style.width = '100%';
      setTimeout(() => {
        if (esPDF) finalizarBulkPDF(file);
        else finalizarBulkCSV(file);
      }, 400);
    }
  }, 320);
};

function finalizarBulkCSV(file) {
  const reader = new FileReader();
  reader.onload = e => {
    const rows = parseCSV(e.target.result);
    if (rows.length < 2) { toast('El CSV no contiene datos suficientes.', 'err'); document.getElementById('bulkPreview').innerHTML = ''; return; }
    const headers = rows[0].map(h => h.trim().toLowerCase());
    const data = rows.slice(1).map(r => {
      const o = {};
      headers.forEach((h, i) => o[h] = (r[i] || '').trim());
      return o;
    });
    state.bulk = { tipo: 'candidatos', archivo: file.name, headers, rows: data };
    renderBulkPreview();
  };
  reader.readAsText(file);
}

function finalizarBulkPDF(file) {
  // Lectura simulada: se generan registros plausibles derivados del nombre del archivo.
  const base = file.name.replace(/\.pdf$/i, '').replace(/[_-]+/g, ' ').trim();

              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;

window.toggleAllBulk = chk => $$('.bulkChk').forEach(c => c.checked = chk);
window.cancelarBulk = () => { state.bulk = null; renderBulkPreview(); toast('Carga masiva cancelada.', 'info'); };
window.confirmarBulk = () => {
  const b = state.bulk;
  if (!b) return;
  const idxs = $$('.bulkChk').filter(c => c.checked).map(c => parseInt(c.dataset.idx, 10));
  if (!idxs.length) { toast('Debe seleccionar al menos un registro.', 'warn'); return; }

  let creados = 0;
  idxs.forEach(i => {
    const r = b.rows[i];
    if (b.tipo === 'candidatos') {
      DB.candidatos.unshift({
        id: uid('CAN'),
        nombre: r.nombre || 'Sin nombre',
        email: r.email || '',
        telefono: r.telefono || '',
        puesto: r.puesto || 'No especificado',
        fuente: r.fuente || 'Carga masiva CSV',
        estado: 'En Revisión',
        habilidades: String(r.habilidades || '').split(/[;|]/).map(s => s.trim()).filter(Boolean),
        experiencia: parseInt(r.experiencia, 10) || 0,
        educacion: r.educacion || '',
        cvNombre: b.archivo,
        fechaRegistro: hoy(),
        notas: ''
      });
      creados++;
    }
  });

  log('CARGA_MASIVA', `${creados} candidato(s) importado(s) desde "${b.archivo}".`);
  state.bulk = null;
  saveDB();
  render();
  toast(`${creados} registro(s) importado(s) correctamente.`, 'ok');
};

    });
  },
  delCand: el => {
    const c = getCand(el.dataset.id);
    if (!c) return;
    DB.candidatos = DB.candidatos.filter(x => x.id !== el.dataset.id);
    log('CANDIDATO_ELIMINADO', `Candidato ${c.nombre} eliminado del banco.`);
    saveDB(); render(); toast('Candidato eliminado.', 'ok');
  },
  gotoBulk: () => { state.view = 'herramientas'; render(); setTimeout(() => document.getElementById('bulkInput')?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 200); },

  /* --- Políticas --- */
  polToggle: el => {
    const id = el.dataset.id;
    state.polOpen = state.polOpen === id ? null : id;
    document.getElementById('polList').innerHTML = listaPoliticas();
  },
  firmarPol: el => {
    const p = DB.politicas.find(x => x.id === el.dataset.id);
    if (!p) return;
    p.conformidades = p.conformidades || [];
    const faltan = DB.empleados.filter(e => !p.conformidades.some(f => f.empleadoId === e.id));
    if (!faltan.length) { toast('Todos los colaboradores ya confirmaron la lectura.', 'info'); return; }
    openModal({
      title: 'Confirmar lectura y conformidad',
      body: `<div class="space-y-4">
        <p class="text-sm text-slate-600">Registre la confirmación de lectura de <strong>${esc(p.titulo)}</strong> (${esc(p.version)}).</p>
        ${formRow('Colaborador', `<select id="firmEmp" class="${INPUT_CLS}">${faltan.map(e => `<option value="${e.id}">${esc(e.nombre)} ${esc(e.apellidos)} — ${esc(e.puesto)}</option>`).join('')}</select>`)}

          <input type="checkbox" id="firmAcepto" class="mt-0.5 rounded">
          <span>El colaborador declara haber leído y comprendido el documento y acepta cumplir con lo establecido en él. El sistema registrará fecha, hora y usuario en la bitácora de auditoría.</span>
        </label>
      </div>`,
      footer: `<button data-act="closeModal" class="px-4 py-2.5 rounded-lg text-sm font-semibold text-slate-600 hover:bg-slate-200 transition">Cancelar</button>
               <button id="btnFirmar" class="px-4 py-2.5 rounded-lg text-sm font-semibold bg-emerald-600 hover:bg-emerald-700 text-white transition">Registrar conformidad</button>`
    });
    document.getElementById('btnFirmar').onclick = () => {
      if (!document.getElementById('firmAcepto').checked) { toast('Debe marcar la casilla de aceptación.', 'warn'); return; }
      const empId = v('firmEmp');
      p.conformidades.push({ empleadoId: empId, fecha: new Date().toISOString() });
      log('CONFORMIDAD_POLITICA', `${nombreEmp(empId)} confirmó lectura de "${p.titulo}" (${p.version}).`);
      saveDB(); closeModal(); render();
      toast('Conformidad registrada correctamente.', 'ok');
    };
  },

  /* --- Herramientas --- */
  exportJSON: () => exportarJSON(),
  exportCSVemp: () => exportarEmpleadosCSV(),
  exportCSVsol: () => exportarSolicitudesCSV(),
  exportLog: () => {
    const headers = ['fecha','usuario','accion','detalle'];
    download(`ExpedienteDigital_Auditoria_${hoy()}.csv`, toCSV(headers, DB.auditoria.map(l => [l.fecha, l.usuario, l.accion, l.detalle])), 'text/csv');
    toast('Bitácora exportada.', 'ok');
  },
  resetDB: () => {
    openModal({
      title: '⚠️ Restablecer datos de demostración',
      body: `<p class="text-sm text-slate-600">Esta acción eliminará <strong>toda la información actual</strong> y restaurará la base de datos de demostración original. Se recomienda exportar un respaldo JSON antes de continuar.</p>
             <p class="text-xs text-rose-600 bg-rose-50 border border-rose-200 rounded-lg p-3 mt-3">Acción irreversible.</p>`,
      footer: `<button data-act="closeModal" class="px-4 py-2.5 rounded-lg text-sm font-semibold text-slate-600 hover:bg-slate-200 transition">Cancelar</button>
               <button id="btnReset" class="px-4 py-2.5 rounded-lg text-sm font-semibold bg-rose-600 hover:bg-rose-700 text-white transition">Restablecer</button>`
    });
    document.getElementById('btnReset').onclick = () => {
      DB = seedDB();
      state.empSel = null; state.polOpen = null; state.bulk = null;
      saveDB(); closeModal(); render();
      toast('Datos de demostración restablecidos.', 'ok');
    };
  }
};

/* --- Resolver solicitud --- */
function resolverSolicitud(id, estado) {
  const s = DB.solicitudes.find(x => x.id === id);
  if (!s) return;
  const emp = getEmp(s.empleadoId);

  openModal({
    title: estado === 'Aprobado' ? '✅ Aprobar solicitud' : '⛔ Rechazar solicitud',
    body: `<div class="space-y-4">
      <div class="bg-slate-50 border border-slate-200 rounded-lg p-4">
        <p class="text-sm font-semibold text-slate-700">${esc(nombreEmp(s.empleadoId))}</p>
        <p class="text-xs text-slate-500 mt-1">${esc(s.tipo)} · ${fmt(s.fechaInicio)} → ${fmt(s.fechaFin)} · <strong>${s.dias} día(s)</strong></p>
        <p class="text-xs text-slate-500 mt-2">${esc(s.motivo || '')}</p>
      </div>
      ${s.tipo === 'Vacaciones' && estado === 'Aprobado' ? `
        <div class="text-xs rounded-lg p-3 ${saldoVacaciones(emp) >= s.dias ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-rose-50 text-rose-700 border border-rose-200'}">
          Saldo disponible: <strong>${saldoVacaciones(emp)} días</strong>. ${saldoVacaciones(emp) >= s.dias ? 'Suficiente para aprobar la solicitud.' : '⚠️ Insuficiente para cubrir los días solicitados.'}
        </div>` : ''}
      ${formRow('Comentario de resolución (opcional)', `<textarea id="solComent" rows="3" class="${INPUT_CLS}" placeholder="Observaciones, condiciones o justificación…"></textarea>`)}
      ${formRow('Resuelto por', `<input id="solPor" class="${INPUT_CLS}" value="admin@itcpo.com">`)}
    </div>`,
    footer: `<button data-act="closeModal" class="px-4 py-2.5 rounded-lg text-sm font-semibold text-slate-600 hover:bg-slate-200 transition">Cancelar</button>
             <button id="btnResolver" class="px-4 py-2.5 rounded-lg text-sm font-semibold text-white transition ${estado === 'Aprobado' ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-rose-600 hover:bg-rose-700'}">
               ${estado === 'Aprobado' ? 'Confirmar aprobación' : 'Confirmar rechazo'}
             </button>`
  });

  document.getElementById('btnResolver').onclick = () => {
    s.estado = estado;
    s.comentario = v('solComent');
    s.resueltoPor = v('solPor') || 'admin@itcpo.com';
    log('SOLICITUD_' + estado.toUpperCase(), `Solicitud ${s.id} (${s.tipo}) de ${nombreEmp(s.empleadoId)}: ${estado}.`);
    saveDB(); closeModal(); render();
    toast(`Solicitud ${estado.toLowerCase()} correctamente.`, estado === 'Aprobado' ? 'ok' : 'warn');
  };
}

    saveDB(); closeModal(); render();

/* --- Modal de solicitud --- */
function modalSolicitud() {
  openModal({
    title: '📝 Nueva solicitud de autoservicio',
    size: 'max-w-2xl',
    body: `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      ${formRow('Colaborador *', `<select id="s_emp" class="${INPUT_CLS}" onchange="actualizarSaldo()">
        <option value="">— Seleccione —</option>
        ${DB.empleados.map(e => `<option value="${e.id}" ${state.empSel === e.id ? 'selected' : ''}>${esc(e.nombre)} ${esc(e.apellidos)} · ${esc(e.departamento)}</option>`).join('')}
      </select>`, 2)}
      <div class="md:col-span-2 hidden" id="saldoBox"></div>
      ${formRow('Tipo de solicitud *', `<select id="s_tipo" class="${INPUT_CLS}">${TIPOS_SOLICITUD.map(t => `<option>${t}</option>`).join('')}</select>`)}
      ${formRow('Días solicitados', `<input id="s_dias" class="${INPUT_CLS} bg-slate-50" readonly value="1">`)}
      ${formRow('Fecha de inicio *', `<input id="s_ini" type="date" value="${hoy()}" class="${INPUT_CLS}" onchange="calcularDias()">`)}
      ${formRow('Fecha de fin *', `<input id="s_fin" type="date" value="${hoy()}" class="${INPUT_CLS}" onchange="calcularDias()">`)}
      ${formRow('Motivo / justificación *', `<textarea id="s_motivo" rows="3" class="${INPUT_CLS}" placeholder="Describa el motivo de la solicitud…"></textarea>`, 2)}
    </div>`,
    footer: `<button data-act="closeModal" class="px-4 py-2.5 rounded-lg text-sm font-semibold text-slate-600 hover:bg-slate-200 transition">Cancelar</button>
             <button id="btnSaveSol" class="px-4 py-2.5 rounded-lg text-sm font-semibold bg-accent-500 hover:bg-accent-600 text-white transition">Enviar solicitud</button>`
  });
  window.actualizarSaldo = () => {
    const emp = getEmp(v('s_emp'));
    const box = document.getElementById('saldoBox');
    if (!emp || !box) { if (box) box.classList.add('hidden'); return; }
    box.classList.remove('hidden');
    box.innerHTML = `<div class="bg-corp-50 border border-corp-200 rounded-lg p-3 text-xs text-corp-700 grid grid-cols-2 sm:grid-cols-4 gap-2">
      <span><strong>Asignados:</strong> ${emp.vacacionesAsignadas || 0}</span>
      <span><strong>Aprobados:</strong> ${(emp.vacacionesAsignadas || 0) - saldoVacaciones(emp)}</span>
      <span><strong>Disponibles:</strong> <span class="font-bold">${saldoVacaciones(emp)}</span></span>
      <span><strong>Departamento:</strong> ${esc(emp.departamento)}</span>
    </div>`;
  };
  window.calcularDias = () => {
    const d = diasEntre(v('s_ini'), v('s_fin'));
    const el = document.getElementById('s_dias');
    if (el) el.value = d;
  };
  if (state.empSel) window.actualizarSaldo();

  document.getElementById('btnSaveSol').onclick = () => {
    const empId = v('s_emp'), ini = v('s_ini'), fin = v('s_fin'), motivo = v('s_motivo');
    if (!empId) { toast('Seleccione un colaborador.', 'warn'); return; }
    if (!ini || !fin) { toast('Indique las fechas de inicio y fin.', 'warn'); return; }
    if (new Date(fin) < new Date(ini)) { toast('La fecha de fin no puede ser anterior a la de inicio.', 'err'); return; }
    if (!motivo) { toast('Describa el motivo de la solicitud.', 'warn'); return; }
    const dias = diasEntre(ini, fin);
    const tipo = v('s_tipo');
    const emp = getEmp(empId);
    if (tipo === 'Vacaciones' && dias > saldoVacaciones(emp)) {
      toast(`Saldo insuficiente: ${saldoVacaciones(emp)} días disponibles y se solicitan ${dias}.`, 'err');
      return;
    }
    const s = {
      id: 'SOL-' + String(DB.solicitudes.length + 1).padStart(4, '0'),
      empleadoId: empId, tipo, fechaInicio: ini, fechaFin: fin, dias,
      motivo, estado: 'Pendiente', fechaSolicitud: hoy(), resueltoPor: '', comentario: ''
    };
    DB.solicitudes.unshift(s);
    log('SOLICITUD_CREADA', `${tipo} de ${dias} día(s) creada para ${nombreEmp(empId)} (${s.id}).`);
    saveDB(); closeModal(); render();
    toast('Solicitud enviada. Estado: Pendiente de aprobación.', 'ok');
  };
}

  $('#sidebar').classList.toggle('-translate-x-full');
  $('#overlay').classList.toggle('hidden');
});
$('#overlay').addEventListener('click', closeSidebar);
